<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velocity Roast Co. | Cart</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header id="top">
      <img src="images/Screenshot 2026-09-29 193508.png" alt="Premium Logo">
      <h1>Velocity Roast Co.</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="build.html">Build</a>
        <a href="saved.html">Saved</a>
        <a href="cart.html">Cart</a>
      </nav>
    </header>

    <section>
      <h2>Your Cart</h2>

      <p id="emptyCart" hidden>Cart is empty for now.</p>

      <ul id="cartItems"></ul>

      <p><strong id="cartTotal">Total: $0.00</strong></p>

      <button type="button" id="clearCartButton" hidden>Clear Cart</button>
    </section>

    <script>
      const storageKey = 'velocityRoastCart';
      const cartItems = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const cartList = document.getElementById('cartItems');
      const emptyCartMessage = document.getElementById('emptyCart');
      const cartTotal = document.getElementById('cartTotal');
      const clearCartButton = document.getElementById('clearCartButton');

      function renderCart() {
        if (!cartItems.length) {
          emptyCartMessage.hidden = false;
          cartList.innerHTML = '';
          cartTotal.textContent = 'Total: $0.00';
          clearCartButton.hidden = true;
          return;
        }

        emptyCartMessage.hidden = true;
        clearCartButton.hidden = false;

        cartList.innerHTML = cartItems.map(function (item, index) {
          const flavorText = item.flavor && item.flavor !== 'None' ? ' | Flavor: ' + item.flavor : '';
          const organicText = item.organic ? ' | Organic / Fair Trade' : '';
          return '<li><strong>' + item.name + '</strong><br>' +
            item.origin + ' | ' + item.roast + ' | ' + item.grind + ' | ' + item.size + flavorText + organicText + '<br>' +
            'Total: $' + Number(item.total).toFixed(2) +
            ' <button type="button" data-index="' + index + '">Delete</button></li>';
        }).join('');

        cartList.querySelectorAll('button').forEach(function (button) {
          button.addEventListener('click', function () {
            const index = Number(button.getAttribute('data-index'));
            const confirmed = window.confirm('Remove this item from your cart?');
            if (!confirmed) {
              return;
            }

            cartItems.splice(index, 1);
            localStorage.setItem(storageKey, JSON.stringify(cartItems));
            renderCart();
          });
        });

        const total = cartItems.reduce(function (sum, item) {
          return sum + Number(item.total || 0);
        }, 0);

        cartTotal.textContent = 'Total: $' + total.toFixed(2);
      }

      clearCartButton.addEventListener('click', function () {
        const confirmed = window.confirm('Are you sure you want to clear your cart?');
        if (!confirmed) {
          return;
        }

        localStorage.removeItem(storageKey);
        cartItems.length = 0;
        renderCart();
      });

      renderCart();
    </script>
  </body>
</html>
